<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.food {
  background: white;
  padding: 12px 15px;
  border-radius: 8px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.food span {
  font-weight: bold;
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: white;
}

.on { background: red; }
.off { background: green; }
</style>
</head>

<body>

<h1>Admin – Food Availability</h1>
<div id="list"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9x_Fvec4nkEHWVJ6D02xDvW",
  authDomain: "qr-menu-fe159.firebaseapp.com",
  projectId: "qr-menu-fe159"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

document.body.insertAdjacentHTML(
  "beforeend",
  "<p style='color:green;text-align:center'>Firebase connected</p>"
);

db.collection("foods").get().then(snapshot => {
  document.body.insertAdjacentHTML(
    "beforeend",
    "<p style='color:blue;text-align:center'>Foods found: " + snapshot.size + "</p>"
  );
});
</script>
</body>
</html>
