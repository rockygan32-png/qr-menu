<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    /* Reset default margin/padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden; /* prevent horizontal scroll */
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #222);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      text-align: center;
      width: 100%;
      max-width: 400px; /* larger on bigger screens */
      background: rgba(255, 255, 255, 0.05);
      padding: 40px 20px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    h1 {
      margin-bottom: 40px;
      font-size: 2em;
      color: gold;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      padding: 18px 20px;
      margin-bottom: 20px;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .dinein {
      background: gold;
      color: black;
    }

    .takeaway {
      background: white;
      color: black;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 1.6em;
      }
      button {
        font-size: 18px;
        padding: 16px 18px;
      }
      .box {
        padding: 30px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Welcome</h1>
    <button class="dinein" onclick="choose('dinein')">🍽️ Dine In</button>
    <button class="takeaway" onclick="choose('takeaway')">🥡 Take Away</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const table = params.get("table");

    function choose(type) {
      // Save order type globally
      localStorage.setItem("orderType", type);

      let url = "order.html";

      if (table) {
        // Always save table if it exists
        localStorage.setItem("table", table);
        url += "?table=" + table + "&type=" + type;
      } else {
        url += "?type=" + type;
      }

      window.location.href = url;
    }
  </script>
</body>
</html>
