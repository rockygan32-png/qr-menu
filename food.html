<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Food Detail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#f9f9f9;
}

img {
  width:100%;
  height:260px;
  object-fit:cover;
}

.container {
  padding:15px;
}

h3 {
  margin-top:25px;
}

.option-group {
  margin-top:20px;
}

.option-row {
  display:flex;
  gap:10px;
  margin-top:10px;
}

.choice {
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  text-align:center;
  cursor:pointer;
}

.choice.active {
  border:2px solid #111;
  background:#111;
  color:white;
}

.addon {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  margin-top:10px;
  cursor:pointer;
}

.addon.active {
  border:2px solid #111;
}

.qty {
  display:flex;
  gap:20px;
  align-items:center;
  margin:20px 0;
}

button {
  padding:10px 16px;
}

.add {
  width:100%;
  background:#111;
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  padding:14px;
}

/* ===== BACK BUTTON ===== */
.back-bar {
  position: sticky;
  top: 0;
  z-index: 300;
  background: #111;
  padding: 10px 15px;
}

.back-btn {
  background: transparent;
  border: none;
  color: gold;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.back-btn:hover {
  opacity: 0.8;
}
</style>
</head>

<body>
<div class="back-bar">
  <button class="back-btn" onclick="goBack()">← Back</button>
</div>
<img id="img">

<div class="container">
  <h2 id="name"></h2>
  <p id="code"></p>
  <p id="desc"></p>

  <div id="options"></div>

  <h3 id="price"></h3>

  <div class="qty">
    <button onclick="chg(-1)">−</button>
    <span id="qty">1</span>
    <button onclick="chg(1)">+</button>
  </div>

  <button class="add" onclick="addCart()">Add to Cart</button>
</div>

<script>
// ================= FOOD CONFIG =================
const FOOD_DATA = {
  // BURGERS
  A01: {
    name: "Chicken Burger",
    code: "A01",
    desc: "Juicy grilled chicken burger with fresh vegetables",
    img: "https://images.unsplash.com/photo-1606755962773-d324e0a13086",
    basePrice: 15,
    options: {
      choices: [
        { label: "Spicy Level", name: "spicy", values: ["Not Spicy", "Spicy"] },
        { label: "Egg", name: "egg", values: ["No Egg", "Egg"] },
        { label: "Lettuce", name: "lettuce", values: ["No Lettuce", "Lettuce"] }
      ],
      addons: [
        { name: "Extra Cheese", price: 2 },
        { name: "Extra Egg", price: 1 },
        { name: "Extra Black Pepper Sauce", price: 0.5 }
      ]
    }
  },

  A02: {
    name: "Beef Burger",
    code: "A02",
    desc: "Tender beef patty with fresh lettuce and tomato",
    img: "https://images.unsplash.com/photo-1550547660-d9450f859349",
    basePrice: 18,
    options: {
      choices: [
        { label: "Spicy Level", name: "spicy", values: ["Not Spicy", "Spicy"] },
        { label: "Cheese", name: "cheese", values: ["No Cheese", "Cheese"] },
        { label: "Lettuce", name: "lettuce", values: ["No Lettuce", "Lettuce"] }
      ],
      addons: [
        { name: "Extra Cheese", price: 2 },
        { name: "Extra Bacon", price: 3 },
        { name: "Extra BBQ Sauce", price: 1 }
      ]
    }
  },

  // PASTA
  B01: {
    name: "Carbonara",
    code: "B01",
    desc: "Creamy carbonara with bacon and parmesan",
    img: "https://images.unsplash.com/photo-1589307004391-3c46a6f0f8d8",
    basePrice: 20,
    options: {
      choices: [
        { label: "Spicy", name: "spicy", values: ["Not Spicy", "Spicy"] },
        { label: "Pasta Type", name: "type", values: ["Spaghetti", "Fettuccine"] }
      ],
      addons: [
        { name: "Extra Cheese", price: 2 },
        { name: "Extra Bacon", price: 3 }
      ]
    }
  },

  B02: {
    name: "Aglio Olio",
    code: "B02",
    desc: "Classic garlic pasta with olive oil and chili flakes",
    img: "https://images.unsplash.com/photo-1525755662778-989d0524087e",
    basePrice: 18,
    options: {
      choices: [
        { label: "Spicy", name: "spicy", values: ["Not Spicy", "Spicy"] },
        { label: "Pasta Type", name: "type", values: ["Spaghetti", "Fettuccine"] }
      ],
      addons: [
        { name: "Extra Cheese", price: 2 },
        { name: "Extra Garlic", price: 0.5 }
      ]
    }
  },

  // ASIAN CUISINE
  C01: {
    name: "Nasi Lemak",
    code: "C01",
    desc: "Traditional Malaysian coconut rice with sambal and anchovies",
    img: "https://images.unsplash.com/photo-1604908554166-5e7c4f2f1e62",
    basePrice: 12,
    options: {
      choices: [
        { label: "Spicy Level", name: "spicy", values: ["Mild", "Medium", "Hot"] },
        { label: "Extra Egg", name: "egg", values: ["No Egg", "Egg"] }
      ],
      addons: [
        { name: "Extra Sambal", price: 1 },
        { name: "Extra Chicken", price: 4 }
      ]
    }
  },

  C02: {
    name: "Nasi Goreng",
    code: "C02",
    desc: "Fried rice with vegetables and choice of meat",
    img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec",
    basePrice: 13,
    options: {
      choices: [
        { label: "Meat", name: "meat", values: ["Chicken", "Beef", "Shrimp"] },
        { label: "Spicy Level", name: "spicy", values: ["Mild", "Medium", "Hot"] }
      ],
      addons: [
        { name: "Extra Egg", price: 1 },
        { name: "Extra Meat", price: 3 }
      ]
    }
  },

  // DRINKS
  D01: {
    name: "Coke",
    code: "D01",
    desc: "Classic Coca-Cola served chilled",
    img: "https://images.unsplash.com/photo-1622483767028-3f66f32b1c31",
    basePrice: 5,
    options: {
      choices: [
        { label: "Ice", name: "ice", values: ["No Ice", "Ice"] },
        { label: "Sugar", name: "sugar", values: ["No Sugar", "Normal Sugar", "Less Sugar"] }
      ],
      addons: [
        { name: "Extra Ice", price: 0.5 }
      ]
    }
  },

  D02: {
    name: "Lemon Tea",
    code: "D02",
    desc: "Refreshing lemon tea",
    img: "https://images.unsplash.com/photo-1556679343-c7306c1976bc",
    basePrice: 6,
    options: {
      choices: [
        { label: "Ice", name: "ice", values: ["No Ice", "Ice"] },
        { label: "Sugar", name: "sugar", values: ["No Sugar", "Normal Sugar", "Less Sugar"] }
      ],
      addons: [
        { name: "Extra Lemon", price: 1 },
        { name: "Extra Ice", price: 0.5 }
      ]
    }
  }
};

// ================= LOAD FOOD =================
const params = new URLSearchParams(location.search);
const code = params.get("code");
const food = FOOD_DATA[code];

if (!food) {
  document.body.innerHTML = "Food not found.";
  throw new Error("Invalid food code");
}

document.getElementById("img").src = food.img;
document.getElementById("name").innerText = food.name;
document.getElementById("code").innerText = food.code;
document.getElementById("desc").innerText = food.desc;

// ================= OPTIONS =================
const optionsDiv = document.getElementById("options");
let selectedChoices = {};
let selectedAddons = [];

// Choices
food.options.choices.forEach(group => {
  selectedChoices[group.name] = group.values[0];

  const groupDiv = document.createElement("div");
  groupDiv.className = "option-group";
  groupDiv.innerHTML = `<h3>${group.label}</h3>`;

  const row = document.createElement("div");
  row.className = "option-row";

  group.values.forEach((value, index) => {
    const box = document.createElement("div");
    box.className = "choice" + (index === 0 ? " active" : "");
    box.innerText = value;

    box.onclick = () => {
      selectedChoices[group.name] = value;
      row.querySelectorAll(".choice").forEach(c => c.classList.remove("active"));
      box.classList.add("active");
    };

    row.appendChild(box);
  });

  groupDiv.appendChild(row);
  optionsDiv.appendChild(groupDiv);
});

// Add-ons
const addonDiv = document.createElement("div");
addonDiv.className = "option-group";
addonDiv.innerHTML = "<h3>Add-ons</h3>";

food.options.addons.forEach(a => {
  const box = document.createElement("div");
  box.className = "addon";
  box.innerHTML = `<span>${a.name}</span><strong>+RM ${a.price}</strong>`;

  box.onclick = () => {
    box.classList.toggle("active");
    selectedAddons.includes(a)
      ? selectedAddons = selectedAddons.filter(x => x !== a)
      : selectedAddons.push(a);
    updatePrice();
  };

  addonDiv.appendChild(box);
});

optionsDiv.appendChild(addonDiv);

// ================= PRICE =================
let qty = 1;

function chg(n) {
  qty = Math.max(1, qty + n);
  document.getElementById("qty").innerText = qty;
  updatePrice();
}

function updatePrice() {
  let price = food.basePrice;
  selectedAddons.forEach(a => price += a.price);
  document.getElementById("price").innerText =
    "Total: RM " + (price * qty).toFixed(2);
}

updatePrice();

// ================= CART =================
function addCart() {
  const cart = JSON.parse(localStorage.getItem("cart") || "[]");

  cart.push({
    code: food.code,
    name: food.name,
    qty,
    choices: selectedChoices,
    addons: selectedAddons.map(a => a.name),
    total: document.getElementById("price").innerText
  });

  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart 🛒");
  history.back();
}

function goBack() {
  // Go back if possible
  if (document.referrer) {
    window.history.back();
  } else {
    // Fallback
    window.location.href = "order.html";
  }
}
</script>

</body>
</html>
