<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>The Windmill Station</title>
<!-- Floating Cart Button with Badge -->
<button id="cartBtn" onclick="goToCart()">
  🛒
  <span id="cartBadge">0</span>
</button>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

/* ===== TOP BAR ===== */
.top-bar {
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 15px;

  position: sticky;
  top: 0;
  z-index: 200;
}

.brand {
  display: flex;
  align-items: center;
}

.brand img {
  height: 40px;
  margin-right: 10px;
}

.order-info {
  font-weight: bold;
  font-size: 14px;
}

/* ===== CATEGORY BAR ===== */
.category-bar {
  display: flex;
  overflow-x: auto;
  background: #222;
  padding: 10px;

  position: sticky;
  top: 115px; /* height of top bar */
  z-index: 150;
}

.category-bar button {
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  margin-right: 20px;
  cursor: pointer;
  white-space: nowrap;
}

.category-bar button.active {
  color: gold;
  border-bottom: 2px solid gold;
}

.category-bar button:hover {
  color: gold;
}

/* ===== SECTION ===== */
.section {
  padding: 15px;
}

.section h2 {
  border-bottom: 2px solid #ddd;
  padding-bottom: 5px;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

/* ===== FOOD CARD ===== */
.food-card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  cursor: pointer;
}

.food-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.food-info {
  padding: 10px;
}

.food-title {
  font-weight: bold;
}

.food-code {
  color: #777;
  font-size: 13px;
}

.food-price {
  margin-top: 5px;
  font-weight: bold;
}

#cartBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #20dc4b; /* green */
  color: white;
  border: none;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  position: fixed;
  overflow: visible;
  transition: transform 0.2s;
}

#cartBtn:hover {
  transform: scale(1.1);
}

/* Badge */
#cartBadge {
  position: absolute;
  top: -8px;
  right: -8px;
  background: red;
  color: white;
  width: 20px;
  height: 20px;
  font-size: 12px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.food-card {
  display: block; /* ensure JS can show/hide properly */
}

/* ===== SEARCH BAR ===== */
.search-bar {
  position: sticky;
  top: 60px; /* below top bar */
  z-index: 180;
  background: #111;
  padding: 10px 15px;
  border-bottom: 1px solid #333;

  max-width: 100%; /* prevent overflow */
  overflow-x: hidden; /* hide accidental scroll */
}

.search-bar input {
  width: 100%;
  padding: 10px 15px;
  font-size: 16px;
  border-radius: 30px;
  border: 1px solid #555;
  background: #222;
  color: white;
  outline: none;
  transition: all 0.2s;

  box-sizing: border-box;  /* ✅ ensures padding and border stay inside width */
}

.search-bar input::placeholder {
  color: #ccc;
}

.search-bar input:focus {
  border-color: gold;  /* highlight gold */
  box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3); /* subtle gold shadow */
}

.search-wrapper {
  position: relative;
  width: 100%;
}

#searchInput {
  padding-right: 40px; /* space for the × */
}

#clearSearch {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #999;
  cursor: pointer;
  display: none;
  user-select: none;
}

#clearSearch:hover {
  color: #ccc;
}
</style>
</head>

<body>

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
  <div class="brand">

  </div>

</div>

<!-- ===== SEARCH BAR ===== -->
<div class="search-bar">

<script>
function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({ behavior: "smooth" });
}

function showDetail(item) {
  alert(item + "\\nMore details coming soon!");
}

/* URL PARAMS */
const params = new URLSearchParams(window.location.search);

let table = localStorage.getItem("table");
let type = localStorage.getItem("orderType");

// First entry only
if (!table && params.get("table")) {
  table = params.get("table");
  localStorage.setItem("table", table);
}

if (!type && params.get("type")) {
  type = params.get("type");
  localStorage.setItem("orderType", type);
}
const tableInfo = document.getElementById("tableInfo");

if (table) {
  tableInfo.innerText =
    (type === "takeaway" ? "🥡 Take Away" : "🍽️ Dine In") +
    " • Table " + table;
} else {
  tableInfo.innerText = "🥡 Take Away";
}
</script>

<script>
const sections = document.querySelectorAll(".section");
const buttons = document.querySelectorAll(".category-bar button");
const bar = document.querySelector(".category-bar");

function setActive(id) {
  buttons.forEach(btn => {
    btn.classList.remove("active");
    if (btn.dataset.target === id) {
      btn.classList.add("active");

      // auto scroll category bar
      btn.scrollIntoView({
        behavior: "smooth",
        inline: "center",
        block: "nearest"
      });
    }
  });
}

window.addEventListener("scroll", () => {
  let current = "";

  sections.forEach(section => {
    const rect = section.getBoundingClientRect();
    if (rect.top <= 120 && rect.bottom >= 120) {
      current = section.id;
    }
  });

  if (current) setActive(current);
});
</script>
<script>
function goFood(name, code, price, desc, img) {
  const url =
    `food.html?name=${encodeURIComponent(name)}` +
    `&code=${code}` +
    `&price=${price}` +
    `&desc=${encodeURIComponent(desc)}` +
    `&img=${encodeURIComponent(img)}`;

  window.location.href = url;
}

function goToCart() {
  window.location.href = "cart.html";
}

// Update badge count
function updateCartBadge() {
  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  const badge = document.getElementById("cartBadge");
  const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
  badge.innerText = totalItems;
}

// Initialize badge on page load
updateCartBadge();
// Update cart badge every 500ms
setInterval(updateCartBadge, 500);
</script>
<script>
function searchFood() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  const foods = document.querySelectorAll(".food-card");

  foods.forEach(food => {
    const text = food.getAttribute("data-search");
    if (text.includes(keyword)) {
      food.style.display = "block";
    } else {
      food.style.display = "none";
    }
  });
}
</script>
<script>
function clearSearch() {
  const input = document.getElementById("searchInput");
  input.value = "";
  searchFood();
  input.focus();
}

const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearSearch");

searchInput.addEventListener("input", () => {
  clearBtn.style.display = searchInput.value ? "block" : "none";
});
</script>
</body>
